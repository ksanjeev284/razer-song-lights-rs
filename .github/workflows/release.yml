name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach binaries to (e.g. v0.8.4)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    # Don't block the whole release if a scarce runner (e.g. macos-13) never starts.
    continue-on-error: ${{ matrix.optional == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: razer-song-lights-windows-x64.exe
            bin: razer-song-lights.exe
            optional: false
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: razer-song-lights-linux-x64
            bin: razer-song-lights
            optional: false
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: razer-song-lights-macos-arm64
            bin: razer-song-lights
            optional: false
          # Optional: GitHub macos-13 runners are often long-queued on free tiers.
          - os: macos-13
            target: x86_64-apple-darwin
            artifact: razer-song-lights-macos-x64
            bin: razer-song-lights
            optional: true

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libudev-dev \
            pkg-config \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libssl-dev \
            libgtk-3-dev

      # Prefer --locked (reproducible); fall back if lock was only version-bumped.
      - name: Build release binary
        run: |
          cargo build --release --locked --target ${{ matrix.target }} \
            || cargo build --release --target ${{ matrix.target }}

      - name: Package artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.bin }}" "${{ matrix.artifact }}"
          Get-FileHash "${{ matrix.artifact }}" -Algorithm SHA256 | Format-List

      - name: Package artifact (Unix)
        if: runner.os != 'Windows'
        run: |
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "${{ matrix.artifact }}"
          chmod +x "${{ matrix.artifact }}"
          shasum -a 256 "${{ matrix.artifact }}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  publish:
    name: Publish GitHub Release assets
    needs: build
    runs-on: ubuntu-latest
    # Upload whatever platforms succeeded even if one matrix leg failed.
    if: >-
      always()
      && needs.build.result != 'cancelled'
      && (startsWith(github.ref, 'refs/tags/v')
          || (github.event_name == 'workflow_dispatch' && inputs.tag != ''))
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
        continue-on-error: true

      - name: List artifacts
        run: |
          ls -lah dist/ || true
          test -d dist && test "$(find dist -type f | wc -l)" -gt 0

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag }}" ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
