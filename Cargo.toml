[package]
name = "razer-song-lights-rs"
version = "0.12.0"
edition = "2021"
description = "Razer Song Lights — full GUI, YouTube, audio, Chroma lights, karaoke, optimized engine"
license = "MIT"
repository = "https://github.com/ksanjeev284/razer-song-lights-rs"
readme = "README.md"
keywords = ["razer", "chroma", "lyrics", "lrc", "karaoke"]
categories = ["multimedia", "command-line-utilities"]
rust-version = "1.74"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3.5.2"
eframe = "0.29"
egui = "0.29"
libloading = "0.8.9"
open = "5"
regex = "1.11"
rfd = "0.15"
rodio = { version = "0.21.1", features = ["symphonia-mp3", "symphonia-wav", "symphonia-isomp4"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.27.0"
thiserror = "2.0"
ureq = { version = "2.12", features = ["json"] }
which = "8.0.4"

[dev-dependencies]
# (unit + integration tests use lib + ureq)

[[bin]]
name = "razer-song-lights"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
strip = true

[dependencies.image]
version = "=0.25.6"

