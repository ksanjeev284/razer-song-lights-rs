[package]
name = "razer-song-lights-rs"
version = "0.1.0"
edition = "2021"
description = "Razer Chroma keyboard lyric light show — Rust core: LRC timing, title parse, lyrics identity, lrclib client"
license = "MIT"
repository = "https://github.com/ksanjeev284/razer-song-lights-rs"
readme = "README.md"
keywords = ["razer", "chroma", "lyrics", "lrc", "karaoke"]
categories = ["multimedia", "command-line-utilities"]
rust-version = "1.74"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
ureq = { version = "2.12", features = ["json"] }

[dev-dependencies]
# (unit + integration tests use lib + ureq)

[[bin]]
name = "razer-song-lights"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
strip = true
